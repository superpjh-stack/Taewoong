# ─────────────────────────────────────────────────────────────
# TaeWoong AI-MES — Local Development Stack
#
#   docker compose up -d           # 전체 스택 기동 (db → migrate/seed → api → web)
#   docker compose logs -f api     # API 로그 추적
#   docker compose down            # 중지 (데이터 유지)
#   docker compose down -v         # 중지 + 볼륨 삭제 (DB 초기화)
#
# 서비스 간 통신은 compose 네트워크의 호스트명(db, redis)으로 이루어진다.
# 따라서 localhost 기반 .env 값을 아래 environment 블록에서 오버라이드한다.
# ─────────────────────────────────────────────────────────────

name: taewung-ai-mes

services:
  # ─── PostgreSQL 16 + TimescaleDB + pgvector ────────────────
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: taewung-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taewung_mes}
      POSTGRES_USER: ${POSTGRES_USER:-mes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mes_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mes_user} -d ${POSTGRES_DB:-taewung_mes}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mes

  # ─── Redis 7 (cache / pub-sub) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taewung-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - mes

  # ─── DB migrate + seed (one-shot, runs then exits) ─────────
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: taewung-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-mes_user}:${POSTGRES_PASSWORD:-mes_password}@db:5432/${POSTGRES_DB:-taewung_mes}
    working_dir: /app/apps/api
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    restart: 'no'
    networks:
      - mes

  # ─── Express API ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: taewung-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mes_user}:${POSTGRES_PASSWORD:-mes_password}@db:5432/${POSTGRES_DB:-taewung_mes}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_taewung_mes_64chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_taewung_mes_64chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      # 소스 바인드 마운트 → tsx watch 핫리로드
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      # 컨테이너 내부 node_modules 보호 (호스트 OS와 분리)
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/types/node_modules
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - mes

  # ─── Next.js Web ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: taewung-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # 브라우저(호스트)에서 접근하므로 localhost 유지
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_this_nextauth_secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - mes

volumes:
  db_data:
  redis_data:

networks:
  mes:
    driver: bridge
